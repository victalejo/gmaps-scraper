name: Deploy to Dokku

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DOKKU_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Dokku
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_APP_NAME: ${{ secrets.DOKKU_APP_NAME }}
        run: |
          git remote add dokku dokku@$DOKKU_HOST:$DOKKU_APP_NAME || true
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" git push dokku HEAD:refs/heads/master --force

      - name: Verify deployment
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_APP_NAME: ${{ secrets.DOKKU_APP_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$DOKKU_HOST "dokku ps:report $DOKKU_APP_NAME"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
